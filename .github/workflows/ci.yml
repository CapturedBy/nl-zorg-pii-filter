name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check --diff .
      - name: Test
        run: pytest --cov=nl_zorg_pii --cov-report=term-missing
      - name: Example runs offline
        run: python examples/llm_roundtrip.py
